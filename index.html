<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine?</title>
  <style>
    :root { --bg1:#ffe6ef; --bg2:#fff6fb; --text:#2b2b2b; }
    * { box-sizing: border-box; }
    body{
      margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 20%, var(--bg1), var(--bg2));
      color: var(--text);
      overflow:hidden;
    }
    .card{
      width:min(720px, 92vw);
      padding: 36px 24px;
      border-radius: 24px;
      background: rgba(255,255,255,0.75);
      box-shadow: 0 16px 50px rgba(0,0,0,0.10);
      border: 1px solid rgba(255,255,255,0.8);
      text-align:center;
      backdrop-filter: blur(10px);
    }
    h1{
      margin: 0 0 14px;
      font-size: clamp(28px, 5vw, 46px);
      letter-spacing: -0.02em;
    }
    p{
      margin: 0 0 24px;
      opacity: 0.85;
      font-size: clamp(14px, 2.6vw, 18px);
    }
    .btns{
      display:flex;
      gap:14px;
      justify-content:center;
      flex-wrap: wrap;
    }
    button{
      border:0;
      padding: 14px 22px;
      border-radius: 999px;
      font-size: 18px;
      cursor:pointer;
      transition: transform .12s ease, filter .12s ease;
      user-select:none;
    }
    #yes{
      background: #ff4d8d;
      color:white;
      box-shadow: 0 10px 24px rgba(255,77,141,0.35);
    }
    #yes:hover{ transform: translateY(-2px); filter: brightness(1.03); }
    #no{
      background: #f1f1f1;
      color:#222;
      position: relative; /* becomes absolute on first run-away */
    }
    .msg{
      margin-top: 18px;
      font-size: 20px;
      font-weight: 700;
      color: #ff2f79;
      min-height: 28px;
    }
    .hint{
      margin-top: 8px;
      font-size: 13px;
      opacity: .65;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Gurleen, will you be my valentine? 💘</h1>
    <p>You only get one correct answer 😄</p>

    <div class="btns">
      <button id="yes">Yes 💖</button>
      <button id="no" aria-label="No">No</button>
    </div>

    <div class="msg" id="msg"></div>
    <div class="hint" id="hint">Try to click “No”… if you can 😅</div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const msg = document.getElementById("msg");
    const hint = document.getElementById("hint");

    // Keep "No" inside the viewport with a little padding
    const PAD = 12;

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function moveNoSomewhereSafe() {
      // Switch to absolute positioning once we start moving it
      noBtn.style.position = "absolute";

      const rect = noBtn.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      const maxX = window.innerWidth - w - PAD;
      const maxY = window.innerHeight - h - PAD;

      const x = rand(PAD, Math.max(PAD, maxX));
      const y = rand(PAD, Math.max(PAD, maxY));

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    }

    // Run away when the mouse gets near it
    function onApproach(e) {
      const rect = noBtn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top  + rect.height / 2;

      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const dist = Math.hypot(dx, dy);

      // If within 140px, jump away
      if (dist < 140) moveNoSomewhereSafe();
    }

    // Also run away on hover/touch attempt
    noBtn.addEventListener("mouseenter", moveNoSomewhereSafe);
    noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); moveNoSomewhereSafe(); }, { passive: false });
    window.addEventListener("mousemove", onApproach);

    yesBtn.addEventListener("click", () => {
      msg.textContent = "YAYYY 💞 I knew you’d say yes!";
      hint.textContent = "Screenshot this and send it back 😄";
      // Simple confetti burst (no library)
      confettiBurst();
      // Disable the runner
      window.removeEventListener("mousemove", onApproach);
      noBtn.style.display = "none";
    });

    function confettiBurst() {
      const n = 120;
      for (let i = 0; i < n; i++) {
        const s = document.createElement("div");
        s.style.position = "fixed";
        s.style.left = (window.innerWidth/2) + "px";
        s.style.top  = (window.innerHeight/2) + "px";
        s.style.width = "8px";
        s.style.height = "12px";
        s.style.borderRadius = "2px";
        s.style.background = `hsl(${Math.random()*360}, 90%, 60%)`;
        s.style.pointerEvents = "none";
        s.style.transform = `translate(-50%, -50%) rotate(${Math.random()*360}deg)`;
        document.body.appendChild(s);

        const angle = Math.random() * Math.PI * 2;
        const dist  = 120 + Math.random()*220;
        const x = Math.cos(angle) * dist;
        const y = Math.sin(angle) * dist;

        s.animate([
          { transform: `translate(-50%, -50%) translate(0px,0px) rotate(0deg)`, opacity: 1 },
          { transform: `translate(-50%, -50%) translate(${x}px,${y}px) rotate(${rand(180,720)}deg)`, opacity: 0 }
        ], { duration: 1200 + Math.random()*600, easing: "cubic-bezier(.2,.7,.2,1)", fill: "forwards" });

        setTimeout(() => s.remove(), 2200);
      }
    }

    // Start with "No" in its normal spot; first interaction moves it.
  </script>
</body>
</html>
