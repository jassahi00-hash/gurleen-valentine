<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine?</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #ffe6ef, #fff);
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.1);
      max-width: 650px;
      width: 90%;
      position: relative;
      z-index: 1;
    }

    h1 { font-size: 36px; margin-bottom: 10px; }
    p { color: #555; margin-bottom: 25px; }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 22px;
      font-size: 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      user-select: none;
    }

    #yes {
      background: #ff4d8d;
      color: white;
    }

    #no {
      background: #eee;
      position: fixed;
      z-index: 9999;
      pointer-events: auto;
    }

    .msg {
      font-size: 20px;
      color: #ff2f79;
      margin-top: 15px;
      line-height: 1.35;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Gurleen, will you be my Valentine? 💖</h1>
    <p>You only get one correct answer 😌</p>

    <div class="buttons">
      <button id="yes">Yes 💕</button>
      <button id="no">No</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const msg = document.getElementById("msg");

    let accepted = false; // stops movement ONLY after Yes

    function moveNo() {
      if (accepted) return;

      const pad = 20;
      const maxX = window.innerWidth - noBtn.offsetWidth - pad;
      const maxY = window.innerHeight - noBtn.offsetHeight - pad;

      noBtn.style.left = Math.max(pad, Math.random() * maxX) + "px";
      noBtn.style.top  = Math.max(pad, Math.random() * maxY) + "px";
    }

    // CONSTANT movement triggers
    window.addEventListener("pointermove", moveNo);
    noBtn.addEventListener("pointerenter", moveNo);
    noBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      moveNo();
    });

    // Keep nudging it every 700ms so it NEVER settles
    setInterval(moveNo, 700);

    yesBtn.addEventListener("click", () => {
      accepted = true;
      msg.innerHTML = `
        💕 It’s a YES 💕<br><br>
        Gurleen,<br>
        I care about you more than I can put into words,<br>
        and I’m really grateful for you 🤍🥹<br><br>
        <strong>Choose carefully:</strong><br>
        Skinny Gurleen, Poo Bear 😉
      `;
      noBtn.style.display = "none";
    });

    // Initial jump
    moveNo();
  </script>
</body>
</html>
