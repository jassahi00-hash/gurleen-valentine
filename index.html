<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine?</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #ffe6ef, #fff);
      overflow:hidden;
    }

    .card{
      background:#fff;
      padding:40px 30px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 20px 50px rgba(0,0,0,0.10);
      max-width:680px;
      width:92%;
      position:relative;
    }

    h1{ font-size:36px; margin:0 0 10px; }
    p{ color:#555; margin:0 0 22px; }

    /* The play area (white box area) */
    .play{
      position:relative;
      width:min(520px, 100%);
      height:140px;
      margin: 0 auto 10px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    #yes{
      background:#ff4d8d;
      color:#fff;
      border:none;
      border-radius:999px;
      padding: 18px 54px;
      font-size:26px;
      font-weight:700;
      cursor:pointer;
      box-shadow: 0 14px 30px rgba(255,77,141,0.35);
      position:relative;
      z-index:2;
      user-select:none;
    }

    /* “No” is tiny like the TikTok */
    #no{
      position:absolute;
      border:none;
      background:transparent;
      color:#222;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      padding:4px 8px;
      z-index:3;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

    .msg{
      font-size:20px;
      color:#ff2f79;
      margin-top:14px;
      line-height:1.35;
      min-height: 28px;
    }

    .sub{
      font-size:12px;
      color:#666;
      margin-top:8px;
      opacity:.75;
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <h1>Gurleen, will you be my Valentine? 💖</h1>
    <p>You only get one correct answer 😌</p>

    <div class="play" id="play">
      <button id="yes">Yes</button>
      <button id="no" aria-label="No">No</button>
    </div>

    <div class="msg" id="msg"></div>
    <div class="sub" id="sub"></div>
  </div>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn  = document.getElementById("no");
    const play   = document.getElementById("play");
    const msg    = document.getElementById("msg");
    const sub    = document.getElementById("sub");

    let accepted = false;

    // Controls how close "No" stays to "Yes" (smaller = tighter orbit)
    const MIN_R = 45;
    const MAX_R = 85;

    // Place "No" somewhere around "Yes" (like orbiting it)
    function placeNoAroundYes() {
      if (accepted) return;

      const playRect = play.getBoundingClientRect();
      const yesRect  = yesBtn.getBoundingClientRect();

      // yes center relative to play
      const cx = (yesRect.left + yesRect.width / 2) - playRect.left;
      const cy = (yesRect.top  + yesRect.height / 2) - playRect.top;

      const angle = Math.random() * Math.PI * 2;
      const r = MIN_R + Math.random() * (MAX_R - MIN_R);

      let x = cx + Math.cos(angle) * r - (noBtn.offsetWidth / 2);
      let y = cy + Math.sin(angle) * r - (noBtn.offsetHeight / 2);

      // Clamp inside play area
      const pad = 8;
      const maxX = playRect.width  - noBtn.offsetWidth  - pad;
      const maxY = playRect.height - noBtn.offsetHeight - pad;

      x = Math.max(pad, Math.min(x, maxX));
      y = Math.max(pad, Math.min(y, maxY));

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    }

    // Move only when pointer comes near "No" (so it feels like it's dodging you)
    function onPointerMove(e) {
      if (accepted) return;

      const noRect = noBtn.getBoundingClientRect();
      const nx = noRect.left + noRect.width / 2;
      const ny = noRect.top  + noRect.height / 2;

      const dist = Math.hypot(e.clientX - nx, e.clientY - ny);

      // If you get close, it jumps to another spot around Yes
      if (dist < 90) placeNoAroundYes();
    }
