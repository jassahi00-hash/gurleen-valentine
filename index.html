<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine?</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #ffe6ef, #fff);
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 90%;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 22px;
      font-size: 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    #yes {
      background: #ff4d8d;
      color: white;
    }

    #no {
      background: #eee;
      position: fixed;
    }

    .msg {
      font-size: 20px;
      color: #ff2f79;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Gurleen, will you be my Valentine? 💖</h1>
    <p>You only get one correct answer 😌</p>

    <div class="buttons">
      <button id="yes">Yes 💕</button>
      <button id="no">No</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const msg = document.getElementById("msg");

    function moveNo() {
      const padding = 20;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      noBtn.style.left = Math.random() * maxX + "px";
      noBtn.style.top = Math.random() * maxY + "px";
    }

    window.addEventListener("pointermove", moveNo);
    noBtn.addEventListener("pointerdown", moveNo);

    yesBtn.addEventListener("click", () => {
      msg.innerHTML = `
        💕 It’s a YES 💕<br><br>
        Gurleen,<br>
        I care about you more than I can put into words,<br>
        and I’m really grateful for you 🤍🥹<br><br>
        <strong>Choose carefully:</strong><br>
        Skinny Gurleen, Poo Bear 😉
      `;
      noBtn.style.display = "none";
    });
  </script>
</body>
</html>
