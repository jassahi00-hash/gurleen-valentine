<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine?</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #ffe6ef, #fff);
    }

    .card{
      background:#fff;
      padding:40px 30px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 20px 50px rgba(0,0,0,0.10);
      width:min(650px,92%);
    }

    h1{
      font-size:36px;
      margin:0 0 12px;
    }

    p{
      color:#555;
      margin:0 0 26px;
    }

    /* Interaction area */
    .play{
      position:relative;
      width:min(520px,100%);
      height:140px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    #yes{
      background:#ff4d8d;
      color:#fff;
      border:none;
      border-radius:999px;
      padding:18px 54px;
      font-size:26px;
      font-weight:700;
      cursor:pointer;
      position:absolute;
      z-index:2;
      box-shadow:0 14px 30px rgba(255,77,141,0.35);
      transition: transform 0.15s ease;
      user-select:none;
    }

    /* Small shy NO */
    #no{
      position:absolute;
      background:transparent;
      border:none;
      color:#111;
      font-size:13px;
      font-weight:600;
      padding:2px 6px;
      z-index:1;
      user-select:none;
      pointer-events:none; /* never clickable */
    }

    .msg{
      font-size:20px;
      color:#ff2f79;
      margin-top:18px;
      line-height:1.35;
      min-height:40px;
    }
  </style>
</head>

<body>

    <h1>Gurleen, will you be my Valentine? 💖</h1>
    <p>You only get one correct answer 😌</p>

    <div class="play" id="play">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

    });
