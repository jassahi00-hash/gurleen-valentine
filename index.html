<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine?</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #ffe6ef, #fff);
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.1);
      width: min(600px, 92%);
    }

    h1 {
      font-size: 36px;
      margin-bottom: 12px;
    }

    p {
      color: #555;
      margin-bottom: 26px;
    }

    /* PLAY AREA */
    .play {
      position: relative;
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #yes {
      background: #ff4d8d;
      color: white;
      border: none;
      border-radius: 999px;
      padding: 18px 54px;
      font-size: 26px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    /* TINY NO (text-like, shy) */
    #no {
      position: absolute;
      background: transparent;
      border: none;
      color: #222;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 6px;
      z-index: 3;
    }

    .msg {
      font-size: 20px;
      color: #ff2f79;
      margin-top: 18px;
      line-height: 1.35;
      min-height: 40px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Gurleen, will you be my Valentine? 💖</h1>
    <p>You only get one correct answer 😌</p>

    <div class="play" id="play">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn  = document.getElementById("no");
    const play   = document.getElementById("play");
    const msg    = document.getElementById("msg");

    let accepted = false;

    // How close No stays to Yes (small = subtle like TikTok)
    const MIN_DIST = 30;
    const MAX_DIST = 55;

    function placeNoNearYes() {
      if (accepted) return;

      const playRect = play.getBoundingClientRect();
      const yesRect  = yesBtn.getBoundingClientRect();

      const cx = (yesRect.left + yesRect.width / 2) - playRect.left;
      const cy = (yesRect.top  + yesRect.height / 2) - playRect.top;

      const angle = Math.random() * Math.PI * 2;
      const dist  = MIN_DIST + Math.random() * (MAX_DIST - MIN_DIST);

      let x = cx + Math.cos(angle) * dist - noBtn.offsetWidth / 2;
      let y = cy + Math.sin(angle) * dist - noBtn.offsetHeight / 2;

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    }

    // ONLY move when hovering No (not whole page)
    noBtn.addEventListener("mouseenter", placeNoNearYes);
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      placeNoNearYes();
    });

    yesBtn.addEventListener("click", () => {
      accepted = true;

      msg.innerHTML = `
        Gurleen,<br>
        I care about you more than I can put into words,<br>
        and I’m really grateful for you 🤍🥹<br><br>
        <strong>Choose carefully:</strong><br>
        Skinny Gurleen, Poo Bear 😉
      `;

      yesBtn.style.display = "none";
      noBtn.style.display  = "none";
    });

    // Initial placement
    setTimeout(placeNoNearYes, 60);
  </script>
</body>
</html>
